name: Monthly holiday date verification reminder
on:
  schedule:
    - cron: "17 16 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  open-review:
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse monthly review issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Monthly holiday date verification review';
            const month = new Date().toISOString().slice(0, 7);
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100
            });
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'date-review' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'date-review', color: 'd4a72c', description: 'Human verification required for holiday dates' });
            }
            if (existing.data.some(issue => issue.title === title && issue.labels.some(label => label.name === 'date-review'))) {
              core.info('An open date-review issue already exists; not duplicating it.');
              return;
            }
            const body = [
              '## Monthly date verification checklist — ' + month,
              '',
              '- [ ] Review the upcoming 12 months of dates and source links.',
              '- [ ] Confirm lunar/religious dates with community or local authoritative calendars.',
              '- [ ] Record region/tradition, sources, checked date, timezone, and sundown/moon-sighting caveats.',
              '- [ ] Keep countdowns paused where evidence conflicts or local confirmation is required.',
              '- [ ] Review date-sensitive event links and update the date manifest only after verification.',
              '- [ ] Run the site checks and link the evidence/commit below.',
              '',
              'Reminder only: this issue does not verify dates automatically and must not be treated as approval.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['date-review']
            });
