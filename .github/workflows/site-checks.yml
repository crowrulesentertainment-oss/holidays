name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/v3.js
          node --check assets/js/year-round-calendar.js
          node --check assets/js/santa-chat.js
          node --check server/index.mjs
          node --check scripts/check-site.mjs
      - name: Check local HTML references
        run: node scripts/check-site.mjs
      - name: Install Chromium browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile browser flows
        run: |
          node scripts/serve-site.mjs > /tmp/crowrules-site.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/test-v3-browser.mjs
